<div class="modal-header {{attr.modalHeaderClass}}">
  <button type="button" class="close" ng-click="resetFieldPredicates()" data-dismiss="modal" aria-label="Close">
    <span class="modal-close" aria-hidden="true">&times;</span>
  </button>
  <h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeFieldPredicate()" novalidate>

  <validationmessage results="fieldPredicateRepo.getValidationResults()"></validationmessage>

  <div class="modal-body">
    <p class="h4"><b>Click confirm to remove the Metadata Key:</b></p>
    <p class="h4">Name: {{modalData.value}}</p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="resetFieldPredicates()">Cancel</button>
    <button type="submit" class="btn btn-danger">Confirm</button>
  </div>
</form>

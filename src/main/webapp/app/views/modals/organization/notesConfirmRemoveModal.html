<div class="modal-header {{attr.modalHeaderClass}}">
	<button 
		type="button" 
		class="close" 
		ng-click="resetNotes()" 
		data-dismiss="modal" 
		aria-label="Close">
		<span class="modal-close" aria-hidden="true">&times;</span>
	</button>
	<h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeNote()" novalidate>

	<validationmessage results="modalData.ValidationResults"></validationmessage>

	<div class="modal-body">
		<p class="h4"><b>Click confirm to remove the Note:</b></p>
		<p class="h4">Workflow Step: {{step.name}}</p>
		<p class="h4">Name: {{modalData.name}}</p>
		<p class="h4">Text: {{modalData.text}}</p>
	</div>

	<div class="modal-footer">
		<button type="button" class="btn btn-default" ng-click="resetNotes()">Cancel</button>
		<button type="submit" class="btn btn-primary">Confirm</button>
	</div>
</form>

<div class="modal-header {{attr.modalHeaderClass}}">
  <button type="button" class="close" ng-click="resetFieldProfiles()" data-dismiss="modal" aria-label="Close">
    <span class="modal-close" aria-hidden="true">&times;</span>
  </button>
  <h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeFieldProfile()" novalidate>

  <validationmessage results="modalData.ValidationResults"></validationmessage>

  <div class="modal-body">
    <p class="h4"><b>Click confirm to remove the Field Profile: {{modalData.gloss}}</b></p>
    <p class="h4">Organization: {{getSelectedOrganizationName()}}</p>
    <p class="h4">Workflow Step: {{step.name}}</p>
    <p class="h4">Predicate: {{modalData.fieldPredicate.value}}</p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="resetFieldProfiles()">Cancel</button>
    <button type="submit" class="btn btn-primary">Confirm</button>
  </div>

</form>

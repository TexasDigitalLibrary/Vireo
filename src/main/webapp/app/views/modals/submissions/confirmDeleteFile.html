<div class="modal-header {{attr.modalHeaderClass}}">
  <button type="button" class="close" ng-click="closeModal()" aria-label="Close">
    <span class="modal-close" aria-hidden="true">&times;</span>
  </button>
  <h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form novalidate>

  <div class="modal-body">
    <p class="h4">
      <b>Click confirm to remove the File:</b>
    </p>
    <p class="h4">Name:
      {{fieldValue.fileInfo.name}}</p>
    <p class="h4">Type:
      {{fieldValue.fileInfo.type}}</p>
    <p class="h4">Size:
      {{fieldValue.fileInfo.size | readableFileSize}}
      KB</p>
  </div>

  <div class="modal-footer">
    <button ng-disabled="deleting" type="button" class="btn btn-default" ng-click="closeModal()">Cancel</button>
    <button ng-disabled="deleting" type="button" class="btn btn-danger" ng-click="removeFile(fieldValue)">
      <span ng-if="!deleting">Confirm</span>
      <span ng-if="deleting">Deleting
        <span class="glyphicon glyphicon-refresh spinning"></span>
      </span>
    </button>
  </div>
</form>

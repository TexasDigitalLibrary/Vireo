<div class="modal-header {{attr.modalHeaderClass}}">
    <button type="button" class="close" ng-click="resetColumns()" aria-label="Close">
        <span class="modal-close" aria-hidden="true">&times;</span>
    </button>
    <h2 class="h3 modal-title">Customize Results Table</h2>
</div>

<div class="modal-body column-modal">
    <div class="row">
        <div class="col-sm-12">
            <p>Please select which columns should be displayed by dragging into or out of the list of displayed columns.</p>
            <div class="col-sm-6">
                <h3 class="h4">Displayed Columns</h3>
                <div class="column-background">
                    <ul class="displayed-column-container" as-sortable="displayedColumnOptions" ng-model="userColumns">
                        <li ng-class="{'displayed-column': !column.status, 'disabled-column': column.status === 'previouslyDisabled'}" ng-repeat="column in userColumns" role="button" tabindex="0" keyboard-activate aria-label="Hide column {{column.title}}" ng-click="disableColumn(column)" as-sortable-item>
                            <div as-sortable-item-handle>{{column.title}}<span class="glyphicon glyphicon-arrow-right pull-right" aria-hidden="true"></span></div>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-sm-6">
                <h3 class="h4">Disabled Columns</h3>
                <div class="column-background">
                    <ul class="disabled-column-container" as-sortable="disabledColumnOptions" ng-model="columns">
                        <li ng-class="{'disabled-column': !column.status, 'displayed-column': column.status === 'previouslyDisplayed'}" ng-repeat="column in columns" role="button" tabindex="0" keyboard-activate aria-label="Show column {{column.title}}" ng-click="enableColumn(column)" as-sortable-item>
                            <div as-sortable-item-handle><span class="glyphicon glyphicon-arrow-left pull-left" aria-hidden="true"></span>&nbsp;{{column.title}}</div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="row results-per-page-container">
        <div class="col-sm-10 col-sm-offset-2">
            <form class="form-inline">
                <label class="control-title" for="resultsPerPageOptions"><strong>Results per page</strong>:</label>
                <select
                    class="form-control results-per-page-select"
                    name="resultsPerPageOptions"
                    ng-model="page.count"
                    ng-options="ps for ps in page.options"
                    ng-change="updatePagination()">
                </select>
            </form>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="resetColumns()">Cancel</button>
    <button type="button" class="btn btn-primary" ng-click="resetColumnsToDefault()">Default Columns</button>
    <button type="button" class="btn btn-primary" ng-disabled="!change" ng-click="saveColumns()">Save</button>
</div>

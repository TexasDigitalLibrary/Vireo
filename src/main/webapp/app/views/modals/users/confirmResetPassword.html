<div class="modal-header {{attr.modalHeaderClass}}">
    <button type="button" class="close" ng-click="closeModal()" aria-label="Close">
        <span class="modal-close" aria-hidden="true">&times;</span>
    </button>
    <h3 class="modal-title">Send Password Reset?</h3>
</div>

<div class="modal-body">
    <p>Send a password reset link to <strong>{{userToResetPassword.email}}</strong>?</p>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="closeModal()">Cancel</button>
    <button type="button" class="btn btn-primary" ng-click="resetPassword()">Confirm</button>
</div>

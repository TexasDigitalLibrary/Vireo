<div class="modal-header {{attr.modalHeaderClass}}">
	<button type="button" class="close" ng-click="resetOrganizationCategories()" aria-label="Close">
		<span class="modal-close" aria-hidden="true">&times;</span>
	</button>
	<h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeOrganizationCategory()" novalidate>

	<validationmessage results="organizationCategoryRepo.getValidationResults()"></validationmessage>

	<div class="modal-body">
		<p class="h4"><b>Click confirm to remove the organization category "{{modalData.name}}"</b></p>
	</div>

	<div class="modal-footer">
		<button type="button" class="btn btn-default" ng-click="resetOrganizationCategories()">Cancel</button>
		<button id="organizationCategories-confirm" type="submit" class="btn btn-primary">Confirm</button>
	</div>
</form>

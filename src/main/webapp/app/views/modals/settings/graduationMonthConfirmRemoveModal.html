<div class="modal-header {{attr.modalHeaderClass}}">
	<button type="button" class="close" ng-click="resetGraduationMonth()" aria-label="Close">
		<span class="modal-close" aria-hidden="true">&times;</span>
	</button>
	<h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeGraduationMonth()" novalidate>

	<validationmessage results="graduationMonthRepo.getValidationResults()"></validationmessage>

	<div class="modal-body">
		<p class="h4"><b>Click confirm to remove the Graduation Month:</b></p>
		<p class="h4">{{toMonthString(modalData.month)}}</p>
	</div>

	<div class="modal-footer">
		<button type="button" class="btn btn-default" ng-click="resetGraduationMonth()">Cancel</button>
		<button id="graduationMonth-confirm" type="submit" class="btn btn-danger">Confirm</button>
	</div>
</form>

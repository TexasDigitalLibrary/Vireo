<div class="modal-header {{attr.modalHeaderClass}}">
	<button type="button" class="close" ng-click="resetEmailTemplates()" aria-label="Close">
		<span class="modal-close" aria-hidden="true">&times;</span>
	</button>
	<h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeEmailTemplate()" novalidate>

	<validationmessage results="emailTemplateRepo.getValidationResults()"></validationmessage>

	<div class="modal-body">
		<p class="h4"><b>Click confirm to remove the email template:</b></p>
		<p class="h4">{{modalData.name}}</p>
	</div>

	<div class="modal-footer">
		<button type="button" class="btn btn-default" ng-click="resetEmailTemplates()">Cancel</button>
		<button id="emailTemplate-confirm" type="submit" class="btn btn-danger">Confirm</button>
	</div>
</form>

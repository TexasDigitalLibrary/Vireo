<div class="modal-header {{attr.modalHeaderClass}}">
	<button type="button" class="close" ng-click="resetControlledVocabulary(true)" aria-label="Close">
		<span class="modal-close" aria-hidden="true">&times;</span>
	</button>
	<h2 class="h3 modal-title">Are You Sure?</h2>
</div>

<form ng-submit="removeControlledVocabulary()" novalidate>

	<validationmessage results="controlledVocabularyRepo.getValidationResults()"></validationmessage>

	<div class="modal-body">
		<p class="h4"><b>Click confirm to remove the Controlled Vocabulary:</b></p>
		<p class="h4">Name: {{modalData.name}}</p>
	</div>

	<div class="modal-footer">
		<button type="button" class="btn btn-default" ng-click="resetControlledVocabulary(true)">Cancel</button>
		<button id="controlledVocabulary-confirm" type="submit" class="btn btn-primary">Confirm</button>
	</div>
</form>

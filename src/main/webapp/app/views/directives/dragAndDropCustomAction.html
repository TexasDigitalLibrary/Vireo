<div class="custom-action">
	<span>{{ item.position }}.</span>
	<span class="mouse-hover-pointer"
		  ng-click="edit({index:item.position})"
		  keyboard-clickable
		  aria-label="Edit {{ item.label }}"
		  ng-mouseenter="isMouseHover=true"
		  ng-mouseleave="isMouseHover=false">
		<span ng-show="!item.isStudentVisible" class="glyphicon glyphicon glyphicon-user" aria-hidden="true"></span>
		<span ng-show="item.isStudentVisible" class="glyphicon glyphicon glyphicon-globe" aria-hidden="true"></span>
		{{item.label}}
	</span>
	<span class="glyphicon glyphicon-pencil edit-setting-icon" aria-hidden="true"></span>
</div>

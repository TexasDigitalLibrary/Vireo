<div class="row">
    <div class="h4">{{ label }}<div tooltip="{{hint}}"><span class="glyphicon glyphicon-info-sign opaque color-reset" aria-hidden="true"></span></div></div>

    <div class="lock-control">
        <a href="" ng-if="locked" ng-click="toggleLock()" class="hover-pointer">
            <span class="glyphicon glyphicon-lock" aria-hidden="true"> </span> This field is locked to prevent accidental editing, click to unlock.
        </a>

        <p ng-if="!locked" role="button" tabindex="0" keyboard-activate ng-click="toggleLock()" class="hover-pointer">
            <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> This field is unlocked and may be edited. Leaving the editable area will save and re-lock the field.
        </p>

        <div ng-show="!locked">
            <div ng-if="wysiwyg !== 'false'">
                <textarea ui-tinymce="tinymceOptions"
                          aria-label="{{ label }}"
                          ng-model="$parent.scopeValue">
                </textarea>
            </div>
            <div ng-if="wysiwyg === 'false'">
                <textarea class="form-control locking-text-area-not-wysiwyg"
                          aria-label="{{ label }}"
                          ng-model="$parent.scopeValue"
                          ng-keypress="$parent.nonWysiwygTyping($event)"
                          ng-blur="$parent.nonWysiwygBlur()">
                </textarea>
            </div>
        </div>
        <div ng-show="locked" class="locking-text-area" ng-bind-html="scopeValue|trusted" disabled></div>

        <div class="hint">{{ hint }}</div>
    </div>
</div>

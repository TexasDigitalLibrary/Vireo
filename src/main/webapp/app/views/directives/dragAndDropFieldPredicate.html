
<div class="document-type" ng-mouseenter="isMouseHover=true" ng-mouseleave="isMouseHover=false">
  <span>{{ $index + 1 }}.</span>
  <span ng-repeat="property in properties" class="repeated-span">
    <span>{{item[property]}}</span>
  </span>
  <span ng-class="{'edit-setting-icon-hidden': !isMouseHover}" class="glyphicon glyphicon-pencil edit-setting-icon" role="button" tabindex="0" keyboard-activate aria-label="Edit {{ item[properties[0]] }}" ng-click="edit({index:item})"></span>
</div>

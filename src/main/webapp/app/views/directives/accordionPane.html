<div id="{{::query}}" class="panel panel-default">
	<div ng-click="toggleExpanded()" class="panel-heading" ng-class="{'expanded': expanded}">
		<div class="panel-selection"><img ng-if="loading" class="loader" src="resources/images/ajax-loader.gif" alt="Loading" /></div>
		<span role="heading" aria-level="{{headingLevel}}"><span role="button" tabindex="0" keyboard-activate aria-expanded="{{ !!expanded }}" ng-transclude></span></span>
		<span class="glyphicon glyphicon-menu-down pull-right" aria-hidden="true" ng-show="!expanded"></span>
		<span class="glyphicon glyphicon-menu-up  pull-right" aria-hidden="true" ng-show="expanded"></span>
	</div>
	<div class="panel-body" ng-class="{'expanded': expanded}">
		<div ng-include="html" class="panel-content-wrapper" onload="loaded()"></div>
	</div>
</div>

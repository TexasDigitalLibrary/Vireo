<div class="deposit-location" ng-mouseenter="isMouseHover=true" ng-mouseleave="isMouseHover=false">
	<span>{{ item.position }}.</span>
	<span ng-repeat="property in properties" class="repeated-span">{{item[property]}}</span>
	<span class="glyphicon glyphicon-pencil edit-setting-icon" ng-click="edit({index:item.position})" keyboard-clickable aria-label="Edit {{ itemLabel(item) }}"></span>
</div>

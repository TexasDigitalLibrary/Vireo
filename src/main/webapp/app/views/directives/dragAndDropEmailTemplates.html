<div class="email-templates" ng-mouseenter="isMouseHover=true" ng-mouseleave="isMouseHover=false">
	<span>{{ item.position }}.</span>
	<span ng-repeat="property in properties" class="repeated-span">{{item[property]}}</span>
	<span ng-show="!item.systemRequired" class="glyphicon glyphicon glyphicon-user"></span>
	<span ng-show="item.systemRequired" class="glyphicon glyphicon glyphicon-globe"></span>
	<span ng-class="{'edit-setting-icon-hidden': !isMouseHover}" class="glyphicon glyphicon-pencil edit-setting-icon" role="button" tabindex="0" keyboard-activate aria-label="Edit {{ item[properties[0]] }}" ng-click="edit({index:item.position})"></span>
</div>

<td class="draggable-table-cell td-center-middle" data-as-sortable-item-handle>
	<span ng-if="item.systemRequired" class="glyphicon glyphicon-globe"></span>
	<span ng-if="!item.systemRequired" class="glyphicon glyphicon-user"></span>
</td>
<td class="draggable-table-cell" data-as-sortable-item-handle>{{item.name}}</td>
<td class="draggable-table-cell" data-as-sortable-item-handle>{{item.description}}</td>
<td class="draggable-table-cell" data-as-sortable-item-handle>
	<span ng-if="item.isActive">Yes</span>
	<span ng-if="!item.isActive">No</span>
</td>
<td class="draggable-table-cell" data-as-sortable-item-handle>
	<span ng-if="item.duration == null">Indefinite</span>
	<span ng-if="item.duration != null">{{item.duration}}</span>
</td>
<td class="draggable-table-cell">
	<button type="button" class="btn btn-default" ng-click="edit({index:item.id})" aria-label="Edit {{item.name}}">Edit</button>
</td>
<!-- Kept outside the sortable handle so the controls are clickable and focusable
     rather than starting a drag. -->
<td class="draggable-table-cell td-center-middle item-controls-cell" ng-include="itemControlsView"></td>

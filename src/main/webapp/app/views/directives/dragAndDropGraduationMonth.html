<div class="graduation-month" ng-mouseenter="isMouseHover=true" ng-mouseleave="isMouseHover=false">
	<span>{{ item.position }}.</span>
	<span ng-repeat="property in properties" class="repeated-span">{{toString({month:item[property]})}}</span>
	<span ng-class="{'edit-setting-icon-hidden': !isMouseHover}" class="glyphicon glyphicon-pencil edit-setting-icon" role="button" tabindex="0" keyboard-activate aria-label="Edit {{ toString({month:item[properties[0]]}) }}" ng-click="edit({index:item.position})"></span>
</div>

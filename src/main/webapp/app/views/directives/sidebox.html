<div class="sidebox-heading" role="button" tabindex="0" keyboard-activate aria-expanded="{{ clicked == '-' }}" ng-click="changeSymbol()">
	<span class="expand pull-right" aria-hidden="true">[{{clicked}}]</span>
	<div class="heading-text">{{heading}}</div>	
</div>
<div class="sidebox-body" ng-class="{'expanded': clicked=='-' ? true: false}" ng-transclude></div>

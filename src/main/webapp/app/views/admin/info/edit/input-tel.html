<div class="input-group">
  <input class="form-control" type="text" ng-model="field.value">
  <span class="input-group-addon glyphicon glyphicon-ok clickable" role="button" tabindex="0" keyboard-activate aria-label="Save {{ fieldProfile.gloss }}" ng-click="save(field)"></span>
  <span class="input-group-addon glyphicon glyphicon-remove clickable" role="button" tabindex="0" keyboard-activate aria-label="Cancel editing {{ fieldProfile.gloss }}" ng-click="cancel(field)"></span>
</div>

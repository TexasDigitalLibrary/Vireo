<div class="input-group">
  <input type="checkbox" ng-model="field.value" class="info-checkbox" ng-true-value="'true'" ng-false-value="'false'">
  <span class="glyphicon glyphicon-ok clickable" role="button" tabindex="0" keyboard-activate aria-label="Save {{ fieldProfile.gloss }}" ng-click="save(field)"></span>
  <span class="glyphicon glyphicon-remove clickable" role="button" tabindex="0" keyboard-activate aria-label="Cancel editing {{ fieldProfile.gloss }}" ng-click="cancel(field)"></span>
</div>

<div class="row">

	<div class="col-md-6">

		<div class="col-md-10 col-md-offset-1">

			<toggleButton
				ng-click="updateConfiguration('application', 'auth.pass.change.enabled')"
				label="Users changing their own password:"
				scope-value="settings.configurable.application['auth.pass.change.enabled'].value"
				toggle-options="{{changePasswordToggleOptions}}">
			</toggleButton>

			<toggleButton
				ng-click="updateConfiguration('application', 'auth.pass.reset.enabled')"
				label="Administrators resetting user passwords:"
				scope-value="settings.configurable.application['auth.pass.reset.enabled'].value"
				toggle-options="{{resetPasswordToggleOptions}}">
			</toggleButton>

		</div>

	</div>

	<div class="col-md-6">

		<div class="col-md-10 col-md-offset-1">

			<validatedinput
				id="passwordResetExpiryHours"
				type="text"
				label="Password Reset Link Expiry (hours)"
				model="settings.configurable.application['auth.pass.reset.expiryHours']"
				property="value"
				validations="settings.configurable.application['auth.pass.reset.expiryHours'].getValidations()"
				confirm="updateConfiguration('application', 'auth.pass.reset.expiryHours')"
				form-view="true"
				tool-tip="Enter the number of hours a password reset link remains valid. Must be a whole number of 1 or more.">
			</validatedinput>

		</div>

	</div>

</div>

<div class="view" ng-controller="ResetPasswordController">

  <div class="container reset-password">

    <h3>Reset Password</h3>
    <hr/>

    <form name="forms.resetPassword" ng-submit="submitResetPassword()" novalidate>

      <div class="row form-group">
        <div class="col-sm-6">
          <label class="control-label" for="newPassword">New Password:</label>
        </div>
        <div class="col-sm-6">
          <input id="newPassword" type="password" name="newPassword" class="form-control" autocomplete="new-password" ng-model="resetPassword.newPassword"/>
        </div>
      </div>

      <div class="row form-group">
        <div class="col-sm-6">
          <label class="control-label" for="confirmPassword">Confirm New Password:</label>
        </div>
        <div class="col-sm-6">
          <input id="confirmPassword" type="password" name="confirmPassword" class="form-control" autocomplete="new-password" ng-model="resetPassword.confirm"/>
        </div>
      </div>

      <div class="row form-group">
        <div class="col-sm-6"></div>
        <div class="col-sm-6">
          <button type="submit" class="btn btn-primary">Set Password</button>
        </div>
      </div>

    </form>

    <hr/>

  </div>

</div>
